# Invarail sidecar services (Tier 1+ — see INSTALL.md).
# Both are OPTIONAL: without FalkorDB, memory falls back to flat files;
# without SearXNG, configure a hosted search provider or skip web search.
#   docker compose up -d
services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: invarail-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkor-data:/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: invarail-searxng
    ports:
      - "8080:8080"
    volumes:
      # searxng/settings.yml is Invarail's SUGGESTED profile (JSON API on, a modest
      # engine set, no autocomplete). Read docs/SEARXNG.md before running this: every query
      # fans out to the engines from YOUR IP. The container writes limiter.toml etc. here.
      - ./searxng:/etc/searxng
    restart: unless-stopped

volumes:
  falkor-data:
