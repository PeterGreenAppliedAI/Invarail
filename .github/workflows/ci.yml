name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
      - name: e2e harness selftest (real registry + pipelines, no model)
        run: npx tsx scripts/e2e-eval.ts --selftest

      - name: Build
        run: npm run build

      - name: Console build
        working-directory: console
        run: npm ci && npm run build
