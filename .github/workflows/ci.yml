name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
      - name: e2e harness selftest (real registry + pipelines, no model)
        run: npx tsx scripts/e2e-eval.ts --selftest

      - name: Build
        run: npm run build

      - name: Console build
        working-directory: console
        run: npm ci && npm run build

  # Windows: the Windows box the project never had. Green since 35e0a17 (2026-09-28: fifteen
  # fixture assumptions made platform-aware, plus four real runtime bugs — python3 naming,
  # forward-slash path slugs, an unhandled MCP stdin EPIPE, and the harness holding SQLite
  # open during cleanup). Blocking: main cannot go red on Windows unseen.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --reporter=dot --reporter=json --outputFile=vitest-windows.json
        shell: bash

      - name: Failure list
        if: always()
        shell: bash
        run: |
          node -e "const r=require('./vitest-windows.json'); const f=[]; for (const file of r.testResults) for (const t of file.assertionResults) if (t.status==='failed') f.push(file.name.replace(process.cwd(),'').replace(/\\\\/g,'/')+' :: '+t.fullName+' :: '+(t.failureMessages[0]||'').split('\n')[0].slice(0,160)); console.log(f.length+' failing on Windows'); console.log(f.join('\n'));"

      - name: e2e harness selftest
        shell: bash
        run: npx tsx scripts/e2e-eval.ts --selftest

      - name: Wizard smokes (headless Starter, then Custom with defaults)
        shell: bash
        run: |
          printf '1\n\nn\nn\n' | npx tsx src/setup/index.ts
          test -f invarail.config.json5 && rm -f invarail.config.json5 .env
          ( printf '2\n'; for i in $(seq 1 60); do printf '\n'; done ) | npx tsx src/setup/index.ts
          test -f invarail.config.json5

      - name: Console build
        working-directory: console
        run: npm ci && npm run build
